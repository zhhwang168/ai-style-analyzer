<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Style Guide | AI 个人风格指南</title>
  <meta name="description" content="AI 辅助个人形象分析，发型·眼镜·穿搭·配色，专业报告邮件交付"/>
  <meta property="og:title" content="AI Style Guide"/>
  <meta property="og:image" content="images/after.jpg"/>
  <style>
    :root{
      --cream:#faf8f4;--cream2:#f2ede4;--cream3:#e8e0d0;
      --green:#6b9e70;--green2:#4d7a52;--green3:#e6f0e7;
      --navy:#1e2d40;--navy2:#2d4560;
      --gold:#c9a84c;--gold2:#fff3cd;
      --red:#e05c5c;--red2:#fdecea;
      --gray1:#2a2a2a;--gray2:#555;--gray3:#888;--gray4:#bbb;
      --r:14px;--r2:8px;
      --sh:0 4px 20px rgba(0,0,0,.08);
      --sh2:0 8px 36px rgba(0,0,0,.14);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:-apple-system,'Hiragino Sans','Noto Sans CJK SC',sans-serif;background:var(--cream);color:var(--gray1);line-height:1.7}
    .promo-banner{background:linear-gradient(90deg,var(--gold),#e8b84b);color:#5a3a00;text-align:center;padding:9px 16px;font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    .promo-banner em{font-style:normal;background:rgba(0,0,0,.12);border-radius:6px;padding:1px 8px}
    nav{position:sticky;top:0;z-index:200;background:rgba(250,248,244,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--cream3);height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
    .nav-logo{font-size:1.05rem;font-weight:800;color:var(--navy);text-decoration:none;display:flex;align-items:center;gap:7px}
    .nav-logo em{color:var(--green);font-style:normal}
    .nav-r{display:flex;align-items:center;gap:6px}
    .lang-btn{background:none;border:1.5px solid var(--cream3);border-radius:18px;padding:3px 11px;font-size:.78rem;cursor:pointer;color:var(--gray2);transition:.2s}
    .lang-btn:hover,.lang-btn.on{background:var(--green);color:#fff;border-color:var(--green)}
    .nav-btn{background:var(--navy);color:#fff;border:none;border-radius:18px;padding:7px 18px;font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;transition:.2s;margin-left:6px}
    .nav-btn:hover{background:var(--navy2)}
    .hero{max-width:1000px;margin:0 auto;padding:72px 24px 56px;text-align:center}
    .hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--green3);color:var(--green2);border-radius:20px;padding:5px 16px;font-size:.78rem;font-weight:700;margin-bottom:22px;letter-spacing:.04em}
    .hero h1{font-size:clamp(1.9rem,4.5vw,3rem);font-weight:900;line-height:1.25;color:var(--navy);margin-bottom:18px}
    .hero h1 em{color:var(--green);font-style:normal}
    .hero-sub{font-size:clamp(.92rem,2vw,1.08rem);color:var(--gray2);max-width:580px;margin:0 auto 32px}
    .hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
    .btn-g{background:var(--green);color:#fff;border:none;border-radius:28px;padding:14px 34px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s;box-shadow:0 4px 18px rgba(107,158,112,.38)}
    .btn-g:hover{background:var(--green2);transform:translateY(-1px)}
    .btn-n{background:var(--navy);color:#fff;border:none;border-radius:28px;padding:14px 34px;font-size:1rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}
    .btn-n:hover{background:var(--navy2)}
    .btn-o{background:#fff;color:var(--gray1);border:1.5px solid var(--cream3);border-radius:28px;padding:13px 28px;font-size:.92rem;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;transition:.2s}
    .btn-o:hover{border-color:var(--green);color:var(--green)}
    .ba-card{max-width:820px;margin:0 auto 16px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh2);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--cream3)}
    .ba-side{position:relative;background:#fff}
    .ba-side.after{background:#f0f4f8}
    .ba-label{position:absolute;top:12px;left:12px;z-index:2;background:var(--gray1);color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.1em;border-radius:6px;padding:3px 10px}
    .ba-side.after .ba-label{background:var(--green)}
    .ba-photo{width:100%;height:260px;object-fit:cover;object-position:top;display:block}
    .ba-footer{padding:14px 16px}
    .ba-tags{display:flex;flex-wrap:wrap;gap:5px}
    .ba-tag{font-size:.72rem;padding:3px 9px;border-radius:10px;background:var(--cream2);color:var(--gray2)}
    .ba-tag.good{background:var(--green3);color:var(--green2);font-weight:600}
    .ba-desc{font-size:.78rem;color:var(--gray3);margin-top:6px}
    @media(max-width:540px){.ba-card{grid-template-columns:1fr}.ba-photo{height:200px}.ba-side.after{border-top:3px solid var(--green)}}
    .trust-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:16px}
    .trust-item{font-size:.78rem;color:var(--gray3);display:flex;align-items:center;gap:4px}
    .trust-item::before{content:"✓";color:var(--green);font-weight:800}
    .sec{max-width:980px;margin:0 auto;padding:64px 24px}
    .sec-hd{text-align:center;margin-bottom:44px}
    .sec-hd h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;color:var(--navy);margin-bottom:10px}
    .sec-hd p{color:var(--gray2);font-size:.95rem;max-width:560px;margin:0 auto}
    hr.div{border:none;border-top:1px solid var(--cream3)}
    .free-sample{max-width:820px;margin:0 auto;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh2);border:2px solid var(--green3)}
    .free-sample-header{background:var(--green3);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
    .free-sample-header span{font-size:.82rem;font-weight:700;color:var(--green2)}
    .free-sample-badge{background:var(--green);color:#fff;font-size:.7rem;border-radius:8px;padding:2px 10px;font-weight:700}
    .free-sample img{width:100%;display:block;max-height:460px;object-fit:contain;background:#fff;cursor:zoom-in}
    .samples-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:720px){.samples-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:460px){.samples-grid{grid-template-columns:1fr}}
    .sample-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:.25s;border:2px solid transparent;cursor:zoom-in}
    .sample-card:hover{box-shadow:var(--sh2);border-color:var(--green3);transform:translateY(-3px)}
    .sample-thumb{height:190px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
    .sample-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .3s;display:block}
    .sample-card:hover .sample-thumb img{transform:scale(1.04)}
    .sample-thumb.c1{background:linear-gradient(135deg,#e8f0e9,#c8deca)}
    .sample-thumb.c2{background:linear-gradient(135deg,#e8eaf6,#c5cae9)}
    .sample-thumb.c3{background:linear-gradient(135deg,#fff8e1,#ffecb3)}
    .sample-thumb.c4{background:linear-gradient(135deg,#fce4ec,#f8bbd0)}
    .sample-thumb.c5{background:linear-gradient(135deg,#e0f7fa,#b2ebf2)}
    .sample-thumb.c6{background:linear-gradient(135deg,#f3e5f5,#e1bee7)}
    .sample-thumb.c7{background:linear-gradient(135deg,#e8f5e9,#a5d6a7)}
    .sample-badge-overlay{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.65rem;border-radius:8px;padding:2px 8px;z-index:1;white-space:nowrap}
    .sample-body{padding:16px}
    .sample-body h3{font-size:.9rem;font-weight:700;margin-bottom:5px}
    .sample-body p{font-size:.79rem;color:var(--gray2);line-height:1.5}
    .sample-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
    .pill{font-size:.7rem;padding:2px 8px;border-radius:8px;background:var(--cream2);color:var(--gray2)}
    .pill.special{background:var(--navy);color:#fff}
    .report-structure{max-width:640px;margin:28px auto 0;background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid var(--cream3)}
    .rs-header{background:var(--navy);color:#fff;padding:12px 20px;font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:8px}
    .rs-row{display:flex;align-items:center;padding:10px 20px;border-bottom:1px solid var(--cream2);gap:12px}
    .rs-row:last-child{border:none}
    .rs-num{width:26px;height:26px;border-radius:50%;background:var(--green3);color:var(--green2);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .rs-num.special{background:var(--navy);color:#fff}
    .rs-num.travel{background:#e8f5e9;color:#2e7d32}
    .rs-text{font-size:.84rem;color:var(--gray1);flex:1}
    .rs-text span{font-size:.74rem;color:var(--gray3);display:block}
    .rs-pages{font-size:.72rem;color:var(--gray3);white-space:nowrap}
    .plans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px}
    .plan-card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:32px 26px;border:2px solid transparent;transition:.25s;position:relative}
    .plan-card:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
    .plan-card.free{border-color:var(--cream3)}
    .plan-card.basic{border-color:var(--green)}
    .plan-card.pro{border-color:var(--navy)}
    .plan-ribbon{position:absolute;top:-13px;left:50%;transform:translateX(-50%);border-radius:12px;padding:3px 16px;font-size:.72rem;font-weight:800;white-space:nowrap}
    .plan-ribbon.green{background:var(--green);color:#fff}
    .plan-ribbon.navy{background:var(--navy);color:#fff}
    .plan-icon{font-size:2rem;margin-bottom:12px}
    .plan-name{font-size:.82rem;color:var(--gray3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .plan-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
    .plan-price-orig{font-size:1rem;color:var(--gray4);text-decoration:line-through}
    .plan-price{font-size:2.2rem;font-weight:900;color:var(--navy)}
    .plan-price span{font-size:1rem;font-weight:500;color:var(--gray3)}
    .plan-promo-tag{background:var(--red2);color:var(--red);font-size:.72rem;font-weight:800;border-radius:8px;padding:2px 8px;white-space:nowrap}
    .plan-delivery{font-size:.78rem;color:var(--gray3);margin-bottom:18px}
    .plan-features{list-style:none;margin-bottom:22px}
    .plan-features li{font-size:.84rem;padding:5px 0;border-bottom:1px solid var(--cream2);display:flex;align-items:flex-start;gap:7px;color:var(--gray2)}
    .plan-features li:last-child{border:none}
    .plan-features li::before{content:"✓";color:var(--green);font-weight:800;flex-shrink:0;margin-top:1px}
    .plan-features li.x::before{content:"–";color:var(--gray4)}
    .plan-features li.x{color:var(--gray4)}
    .plan-features li.highlight{color:var(--navy);font-weight:600}
    .plan-features li.highlight::before{content:"🌏";font-size:.8rem}
    .plan-btn{width:100%;padding:12px;border-radius:24px;font-size:.9rem;font-weight:700;cursor:pointer;transition:.2s;border:none;text-decoration:none;display:block;text-align:center}
    .plan-btn.free-btn{background:var(--cream2);color:var(--gray2)}
    .plan-btn.free-btn:hover{background:var(--cream3)}
    .plan-btn.basic-btn{background:var(--green);color:#fff}
    .plan-btn.basic-btn:hover{background:var(--green2)}
    .plan-btn.pro-btn{background:var(--navy);color:#fff}
    .plan-btn.pro-btn:hover{background:var(--navy2)}
    .promo-notice{margin-top:24px;background:var(--gold2);border-radius:var(--r2);padding:16px 20px;display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--gold)}
    .promo-notice p{font-size:.84rem;color:#5a3a00;line-height:1.7}
    .selector-box{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:32px;margin-top:32px}
    .selector-box h3{font-size:1rem;font-weight:700;margin-bottom:6px;color:var(--navy)}
    .selector-box>p{font-size:.84rem;color:var(--gray2);margin-bottom:20px}
    .analysis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:16px}
    .analysis-item{border:1.5px solid var(--cream3);border-radius:var(--r2);padding:11px 13px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:9px;user-select:none}
    .analysis-item:hover{border-color:var(--green);background:var(--green3)}
    .analysis-item.sel{border-color:var(--green);background:var(--green3)}
    .ai-icon{font-size:1.25rem;flex-shrink:0}
    .ai-text strong{font-size:.8rem;display:block;color:var(--gray1)}
    .ai-text span{font-size:.7rem;color:var(--gray3)}
    .ai-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--cream3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;transition:.2s;margin-left:auto}
    .analysis-item.sel .ai-check{background:var(--green);border-color:var(--green);color:#fff}
    .sel-count{font-size:.82rem;color:var(--gray3);margin-bottom:14px}
    .sel-count em{color:var(--green);font-weight:700;font-style:normal}
    .pref-area label{font-size:.82rem;font-weight:600;color:var(--gray2);display:block;margin-bottom:6px}
    .pref-area textarea{width:100%;border:1.5px solid var(--cream3);border-radius:var(--r2);padding:10px 14px;font-size:.84rem;color:var(--gray1);resize:vertical;min-height:80px;font-family:inherit;transition:.2s}
    .pref-area textarea:focus{outline:none;border-color:var(--green)}
    .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:20px}
    .step{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:24px 18px;text-align:center}
    .step-n{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:.95rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .step h3{font-size:.9rem;font-weight:700;margin-bottom:7px;color:var(--navy)}
    .step p{font-size:.8rem;color:var(--gray2)}
    .contact-box{background:var(--navy);border-radius:var(--r);padding:48px 36px;text-align:center;color:#fff}
    .contact-box h2{font-size:1.6rem;font-weight:800;margin-bottom:12px}
    .contact-box>p{color:rgba(255,255,255,.7);font-size:.92rem;margin-bottom:12px;max-width:480px;margin-left:auto;margin-right:auto}
    .contact-steps{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto 28px;text-align:left}
    .contact-step-item{display:flex;align-items:flex-start;gap:10px;font-size:.84rem;color:rgba(255,255,255,.75)}
    .contact-step-num{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
    .contact-cta-btn{display:inline-block;background:var(--green);color:#fff;border:none;border-radius:28px;padding:16px 44px;font-size:1.05rem;font-weight:700;cursor:pointer;text-decoration:none;transition:.2s;box-shadow:0 4px 18px rgba(107,158,112,.4)}
    .contact-cta-btn:hover{background:var(--green2);transform:translateY(-1px)}
    .contact-note{font-size:.75rem;color:rgba(255,255,255,.4);margin-top:14px}
    .faq-list{display:flex;flex-direction:column;gap:10px}
    .faq-item{background:#fff;border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden}
    .faq-q{padding:16px 20px;font-weight:600;font-size:.9rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;transition:.2s}
    .faq-q:hover{color:var(--green)}
    .faq-icon{font-size:1rem;transition:transform .25s;flex-shrink:0}
    .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s;font-size:.85rem;color:var(--gray2);line-height:1.7;padding:0 20px}
    .faq-item.open .faq-a{max-height:300px;padding:0 20px 16px}
    .faq-item.open .faq-icon{transform:rotate(45deg)}
    footer{background:var(--gray1);color:#888;padding:40px 24px;text-align:center;font-size:.8rem;line-height:2}
    .footer-brand{color:#fff;font-weight:800;font-size:1rem;margin-bottom:6px}
    .footer-links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0}
    .footer-links a{color:#aaa;text-decoration:none}
    .footer-links a:hover{color:var(--green)}
    .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
    .lightbox.open{display:flex}
    .lightbox img{max-width:92vw;max-height:92vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6);cursor:default}
    .lightbox-close{position:absolute;top:18px;right:22px;color:#fff;font-size:2rem;cursor:pointer;line-height:1;opacity:.8}
    .lightbox-close:hover{opacity:1}
    .fi{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s}
    .fi.vis{opacity:1;transform:none}
    @media(max-width:640px){.sec{padding:44px 16px}.contact-box{padding:32px 20px}.selector-box{padding:20px}}
  </style>
</head>
<body>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">✕</span>
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()"/>
</div>

<div class="promo-banner" id="promo-banner"></div>

<nav>
  <a class="nav-logo" href="#">✦ <em>AI</em> Style Guide</a>
  <div class="nav-r">
    <button class="lang-btn on" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" onclick="setLang('ja')">日本語</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <a href="#" id="nav-cta" target="_blank" class="nav-btn"></a>
  </div>
</nav>

<section class="hero fi">
  <div class="hero-badge" id="hero-badge"></div>
  <h1 id="hero-h1"></h1>
  <p class="hero-sub" id="hero-sub"></p>
  <div class="hero-btns">
    <a href="#" id="hero-btn1" target="_blank" class="btn-g"></a>
    <a href="#plans" class="btn-n" id="hero-btn2"></a>
    <a href="#samples" class="btn-o" id="hero-btn3"></a>
  </div>
  <div class="ba-card">
    <div class="ba-side">
      <div class="ba-label">BEFORE</div>
      <img class="ba-photo" src="images/before.jpg" alt="Before"/>
      <div class="ba-footer">
        <div class="ba-tags" id="ba-tags-b"></div>
        <p class="ba-desc" id="ba-before-desc"></p>
      </div>
    </div>
    <div class="ba-side after">
      <div class="ba-label">AFTER</div>
      <img class="ba-photo" src="images/after.jpg" alt="After"/>
      <div class="ba-footer">
        <div class="ba-tags" id="ba-tags-a"></div>
        <p class="ba-desc" id="ba-after-desc"></p>
      </div>
    </div>
  </div>
  <div class="trust-row">
    <span class="trust-item" id="tr1"></span>
    <span class="trust-item" id="tr2"></span>
    <span class="trust-item" id="tr3"></span>
    <span class="trust-item" id="tr4"></span>
  </div>
</section>

<hr class="div"/>

<section class="sec fi" id="free-preview-sec">
  <div class="sec-hd">
    <h2 id="free-h2"></h2>
    <p id="free-p"></p>
  </div>
  <div class="free-sample">
    <div class="free-sample-header">
      <span id="free-sample-label"></span>
      <span class="free-sample-badge" id="free-sample-badge"></span>
    </div>
    <img src="images/test.png" alt="Free preview sample" onclick="openLightbox('images/test.png')"/>
  </div>
  <p style="text-align:center;font-size:.78rem;color:var(--gray3);margin-top:12px" id="free-disclaimer"></p>
</section>

<hr class="div"/>

<section class="sec fi" id="samples">
  <div class="sec-hd">
    <h2 id="samples-h2"></h2>
    <p id="samples-p"></p>
  </div>
  <div class="samples-grid" id="samples-grid"></div>
  <p style="text-align:center;font-size:.78rem;color:var(--gray3);margin-top:16px" id="samples-disclaimer"></p>
</section>

<hr class="div"/>

<section class="sec fi" id="plans">
  <div class="sec-hd">
    <h2 id="plans-h2"></h2>
    <p id="plans-p"></p>
  </div>
  <div class="plans-grid" id="plans-grid"></div>
  <div class="promo-notice">
    <div style="font-size:1.3rem;flex-shrink:0">⚠️</div>
    <p id="promo-notice-text"></p>
  </div>

let lang='zh',selected=new Set(),MAX_SEL=5;

function setLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('on'));
  document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('on');
  document.documentElement.lang=l==='zh'?'zh':l==='ja'?'ja':'en';
  render();
}

function toggleAnalysis(i){
  const el=document.getElementById(`ai-${i}`),ck=document.getElementById(`aic-${i}`);
  if(selected.has(i)){selected.delete(i);el.classList.remove('sel');ck.textContent='';}
  else{
    if(selected.size>=MAX_SEL){alert(lang==='zh'?`最多选择${MAX_SEL}项`:lang==='ja'?`最大${MAX_SEL}項目`:`Max ${MAX_SEL} items`);return;}
    selected.add(i);el.classList.add('sel');ck.textContent='✓';
  }
  updateSelCount();
}
function updateSelCount(){
  const n=selected.size,el=document.getElementById('sel-count');if(!el)return;
  if(lang==='zh')el.innerHTML=`已选 <em>${n}</em> / ${MAX_SEL} 项`;
  else if(lang==='ja')el.innerHTML=`<em>${n}</em> / ${MAX_SEL} 項目選択中`;
  else el.innerHTML=`<em>${n}</em> / ${MAX_SEL} selected`;
}
function toggleFaq(i){document.getElementById(`faq-${i}`).classList.toggle('open');}
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('vis');});
},{threshold:.08});
document.querySelectorAll('.fi').forEach(el=>obs.observe(el));
render();
